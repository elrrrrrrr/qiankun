name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - next
      - 1.x

jobs:
  build-check-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [lts/*, latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install utoo
        uses: utooland/setup-utoo@v1

      - run: ut install --from pnpm --ignore-scripts

      - name: TS Build Check
        run: ut run build

      - name: Run eslint
        run: ut run eslint

      - name: Run prettier
        run: ut run prettier:check

      - name: Doc Build check
        run: ut run docs:build

  unit-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [lts/*, latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install utoo
        uses: utooland/setup-utoo@v1

      - run: ut install --from pnpm --ignore-scripts

      - name: Run unit test
        run: ut run test
